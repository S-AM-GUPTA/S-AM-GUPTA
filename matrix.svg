<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
<defs>
<style>
.bg{fill:#0d1117}
.r{font-family:'Courier New',monospace;font-size:13px;font-weight:700}
.a{fill:#00d4ff;opacity:.95}
.b{fill:#0090b0;opacity:.65}
.c{fill:#004a66;opacity:.4}
.d{fill:#002233;opacity:.25}

@keyframes rn{0%{transform:translateY(-200px)}100%{transform:translateY(260px)}}
@keyframes pw{0%,100%{filter:drop-shadow(0 0 6px #00d4ff) drop-shadow(0 0 14px #00d4ff)}50%{filter:drop-shadow(0 0 22px #00d4ff) drop-shadow(0 0 50px #00d4ff) drop-shadow(0 0 70px #0080c0)}}
@keyframes bk{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes si{0%{opacity:0;letter-spacing:18px}100%{opacity:1;letter-spacing:3px}}
@keyframes fi{0%{opacity:0;transform:translateY(10px)}100%{opacity:.8;transform:translateY(0)}}

.gw{animation:pw 2.5s ease-in-out infinite}
.cr{animation:bk 1.2s step-end infinite;fill:#00d4ff}
.tt{animation:si 1.8s ease-out forwards;animation-delay:.3s;opacity:0}
.st{animation:fi 1.5s ease-out forwards;animation-delay:1.2s;opacity:0}
.s2{animation:fi 1.5s ease-out forwards;animation-delay:1.6s;opacity:0}

.n1{animation:rn 2.1s linear infinite;animation-delay:0s}
.n2{animation:rn 3.2s linear infinite;animation-delay:.4s}
.n3{animation:rn 2.7s linear infinite;animation-delay:1.1s}
