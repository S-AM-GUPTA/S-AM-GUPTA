<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
<defs>
<style>
.bg{fill:#0d1117}
.track{fill:none;stroke:#1a2a3a;stroke-width:2}
.dot{fill:#00d4ff;opacity:.9}
.score-txt{font-family:'Courier New',monospace;font-size:11px;fill:#00d4ff;opacity:.7}
.label{font-family:'Courier New',monospace;font-size:10px;fill:#00d4ff;opacity:.5}

/* Pac-Man mouth animation */
@keyframes chomp{
  0%,100%{d:path("M450,60 L450,60 A28,28 0 1,1 450,60 Z")}
  50%{d:path("M450,60 L478,42 A28,28 0 1,1 478,78 Z")}
}
/* Pac-Man move right then teleport left */
@keyframes move{
  0%{transform:translateX(-60px)}
  95%{transform:translateX(900px)}
  96%{transform:translateX(-60px)}
  100%{transform:translateX(-60px)}
}
/* Ghost bob */
@keyframes bob{
  0%,100%{transform:translateY(0px)}
  50%{transform:translateY(-5px)}
}
/* Ghost chase pac-man */
@keyframes chase{
  0%{transform:translateX(-100px)}
  95%{transform:translateX(840px)}
  96%{transform:translateX(-100px)}
  100%{transform:translateX(-100px)}
}
@keyframes chase2{
  0%{transform:translateX(-160px)}
  95%{transform:translateX(780px)}
  96%{transform:translateX(-160px)}
  100%{transform:translateX(-160px)}
}
/* Dots eaten — fade as pac-man passes */
@keyframes eat1{0%,10%{opacity:.9}11%,100%{opacity:0}}
@keyframes eat2{0%,18%{opacity:.9}19%,100%{opacity:0}}
@keyframes eat3{0%,26%{opacity:.9}27%,100%{opacity:0}}
@keyframes eat4{0%,34%{opacity:.9}35%,100%{opacity:0}}
@keyframes eat5{0%,41%{opacity:.9}42%,100%{opacity:0}}
@keyframes eat6{0%,48%{opacity:.9}49%,100%{opacity:0}}
@keyframes eat7{0%,55%{opacity:.9}56%,100%{opacity:0}}
@keyframes eat8{0%,62%{opacity:.9}63%,100%{opacity:0}}
@keyframes eat9{0%,69%{opacity:.9}70%,100%{opacity:0}}
@keyframes eat10{0%,76%{opacity:.9}77%,100%{opacity:0}}
@keyframes eat11{0%,83%{opacity:.9}84%,100%{opacity:0}}
@keyframes eat12{0%,90%{opacity:.9}91%,100%{opacity:0}}
@keyframes score-up{0%,85%{opacity:0;transform:translateY(0)}86%,90%{opacity:1;transform:translateY(-8px)}100%{opacity:0}}

.pac{animation:move 6s linear infinite}
.g1{animation:chase 6s linear infinite}
.g2{animation:chase2 6s linear infinite}

.d1{animation:eat1 6s linear infinite}
.d2{animation:eat2 6s linear infinite}
.d3{animation:eat3 6s linear infinite}
.d4{animation:eat4 6s linear infinite}
.d5{animation:eat5 6s linear infinite}
.d6{animation:eat6 6s linear infinite}
.d7{animation:eat7 6s linear infinite}
.d8{animation:eat8 6s linear infinite}
.d9{animation:eat9 6s linear infinite}
.d10{animation:eat10 6s linear infinite}
.d11{animation:eat11 6s linear infinite}
.d12{animation:eat12 6s linear infinite}
</style>
</defs>

<!-- Background -->
<rect class="bg" width="900" height="120"/>

<!-- Decorative border -->
<rect x="1" y="1" width="898" height="118" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.2" rx="6"/>

<!-- Score & Labels -->
<text class="score-txt" x="20" y="20">SCORE</text>
<text class="score-txt" x="20" y="34" font-size="16px" opacity="1" fill="#00d4ff">012480</text>
<text class="score-txt" x="820" y="20">LIVES</text>
<!-- Life indicators -->
<circle cx="822" cy="33" r="5" fill="#FFD700"/>
<circle cx="836" cy="33" r="5" fill="#FFD700"/>
<circle cx="850" cy="33" r="5" fill="#FFD700"/>

<!-- Track line -->
<line x1="0" y1="65" x2="900" y2="65" stroke="#1a2a3a" stroke-width="1.5"/>

<!-- Dots on track (12 evenly spaced) -->
<circle class="dot d1"  cx="60"  cy="65" r="5"/>
<circle class="dot d2"  cx="130" cy="65" r="3"/>
<circle class="dot d3"  cx="200" cy="65" r="5"/>
<circle class="dot d4"  cx="270" cy="65" r="3"/>
<circle class="dot d5"  cx="340" cy="65" r="5"/>
<circle class="dot d6"  cx="410" cy="65" r="3"/>
<circle class="dot d7"  cx="480" cy="65" r="5"/>
<circle class="dot d8"  cx="550" cy="65" r="3"/>
<circle class="dot d9"  cx="620" cy="65" r="5"/>
<circle class="dot d10" cx="690" cy="65" r="3"/>
<circle class="dot d11" cx="760" cy="65" r="5"/>
<circle class="dot d12" cx="830" cy="65" r="3"/>

<!-- PAC-MAN -->
<g class="pac">
  <!-- Body -->
  <circle cx="0" cy="65" r="22" fill="#FFD700"/>
  <!-- Animated mouth (clipping wedge) -->
  <polygon points="0,65 25,48 25,82" fill="#0d1117">
    <animateTransform attributeName="transform" type="rotate" values="0,0,65;25,0,65;0,0,65" dur="0.3s" repeatCount="indefinite"/>
  </polygon>
  <!-- Eye -->
  <circle cx="-5" cy="50" r="3" fill="#0d1117"/>
</g>

<!-- GHOST 1 (Cyan - Inky) -->
<g class="g1">
  <!-- Body -->
  <ellipse cx="-50" cy="62" rx="16" ry="14" fill="#00d4ff"/>
  <rect x="-66" y="62" width="32" height="12" fill="#00d4ff"/>
  <!-- Skirt waves -->
  <polygon points="-66,74 -58,68 -50,74 -42,68 -34,74" fill="#0d1117"/>
  <!-- Eyes -->
  <ellipse cx="-57" cy="58" rx="5" ry="6" fill="white"/>
  <ellipse cx="-43" cy="58" rx="5" ry="6" fill="white"/>
  <circle cx="-55" cy="59" r="3" fill="#00008B"/>
  <circle cx="-41" cy="59" r="3" fill="#00008B"/>
</g>

<!-- GHOST 2 (Pink - Pinky) -->
<g class="g2">
  <!-- Body -->
  <ellipse cx="-50" cy="62" rx="16" ry="14" fill="#FF69B4"/>
  <rect x="-66" y="62" width="32" height="12" fill="#FF69B4"/>
  <!-- Skirt waves -->
  <polygon points="-66,74 -58,68 -50,74 -42,68 -34,74" fill="#0d1117"/>
  <!-- Eyes -->
  <ellipse cx="-57" cy="58" rx="5" ry="6" fill="white"/>
  <ellipse cx="-43" cy="58" rx="5" ry="6" fill="white"/>
  <circle cx="-55" cy="59" r="3" fill="#00008B"/>
  <circle cx="-41" cy="59" r="3" fill="#00008B"/>
</g>

<!-- Bottom label -->
<text class="label" x="450" y="108" text-anchor="middle">— GITHUB CONTRIBUTION ARCADE —</text>
</svg>
